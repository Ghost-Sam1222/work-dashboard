<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>总账本</title>
<style>
  :root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #222221;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.08);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
    --good:           #0ca30c;
    --warning:        #fab219;
    --critical:       #d03b3b;
    --radius:         16px;
    --radius-sm:      10px;
    --font:           system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--page-plane);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    padding: 32px 24px 24px;
    text-align: center;
  }
  .header h1 {
    font-size: 15px;
    font-weight: 590;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .hero-figure {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .hero-figure .currency { font-size: 28px; font-weight: 500; color: var(--text-secondary); margin-right: 3px; }
  .hero-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* ── Sub-ledger grid ── */
  .ledgers-section {
    padding: 0 24px 32px;
    max-width: 720px;
    margin: 0 auto;
  }
  .ledgers-section h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  .ledger-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ledger-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, background .15s;
    cursor: pointer;
  }
  .ledger-card:hover {
    border-color: rgba(255,255,255,0.14);
    background: var(--surface-2);
  }

  .ledger-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .ledger-icon.preset-1 { background: rgba(57,135,229,0.16); }
  .ledger-icon.preset-2 { background: rgba(217,89,38,0.16); }
  .ledger-icon.preset-3 { background: rgba(25,158,112,0.16); }
  .ledger-icon.preset-4 { background: rgba(201,133,0,0.16); }

  .ledger-info { flex: 1; min-width: 0; }
  .ledger-info .name { font-size: 15px; font-weight: 620; color: var(--text-primary); }
  .ledger-info .meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ledger-total {
    text-align: right;
    flex-shrink: 0;
  }
  .ledger-total .amount {
    font-size: 18px;
    font-weight: 680;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }
  .ledger-total .period {
    font-size: 11px;
    color: var(--text-muted);
  }

  .ledger-edit, .ledger-arrow {
    color: var(--text-muted); flex-shrink: 0; opacity: 0; transition: opacity .15s;
  }
  .ledger-edit { padding: 4px; border-radius: 6px; }
  .ledger-edit:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
  .ledger-card:hover .ledger-edit { opacity: .4; }
  .ledger-card:hover .ledger-edit:hover { opacity: 1; }
  .ledger-card:hover .ledger-arrow { opacity: .6; }

  /* ── Add card ── */
  .add-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px 20px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-size: 14px;
    font-family: var(--font);
    cursor: pointer;
    transition: border-color .15s, color .15s;
    width: 100%;
  }
  .add-card:hover { border-color: rgba(255,255,255,0.16); color: var(--text-secondary); }

  /* ── Icon picker ── */
  .icon-preview { width: 52px; height: 52px; border-radius: 14px; background: var(--surface-1); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 10px; background-size: cover; background-position: center; flex-shrink: 0; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .emoji-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .1s; padding: 0; }
  .emoji-btn:hover { background: rgba(255,255,255,0.06); border-color: var(--border); }
  .emoji-btn.selected { background: rgba(57,135,229,0.15); border-color: var(--series-1); }
  .icon-upload-row { display: flex; align-items: center; gap: 8px; }
  .icon-hint { font-size: 10px; color: var(--text-muted); }

  /* Ledger card with image icon */
  .ledger-icon.img-icon { font-size: 0; background-size: cover; background-position: center; }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 16px; font-weight: 620; color: var(--text-secondary); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; color: var(--text-muted); }

  /* ── Modal ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.4);
  }
  .modal h2 { font-size: 18px; font-weight: 640; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 590;
    color: var(--text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field input, .field select {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 15px;
    font-family: var(--font);
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--series-1); }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 590;
    font-family: var(--font);
    cursor: pointer;
    border: none;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--series-1); color: #fff; }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.04); }
  .btn-sm { padding: 5px 12px; font-size: 11px; }

  /* ── Quick stats ── */
  .quick-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 720px;
    margin: 0 auto 24px;
    padding: 0 24px;
  }
  .stat-pill {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: center;
  }
  .stat-pill .val { font-size: 22px; font-weight: 680; }
  .stat-pill .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  @media (max-width: 500px) {
    .header { padding: 24px 16px 20px; }
    .hero-figure { font-size: 48px; }
    .hero-figure .currency { font-size: 22px; }
    .ledgers-section { padding: 0 16px 24px; }
    .quick-stats { padding: 0 16px; gap: 8px; }
    .quick-stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <h1>💰 总账本</h1>
  <div class="hero-figure">
    <span class="currency">¥</span><span id="heroTotal">0</span>
  </div>
  <div class="hero-label" id="heroLabel">全部子账本合计</div>
</div>

<!-- ── Quick stats ── -->
<div class="quick-stats" id="quickStats" style="display:none">
  <div class="stat-pill">
    <div class="val" id="statLedgerCount">0</div>
    <div class="lbl">子账本数</div>
  </div>
  <div class="stat-pill">
    <div class="val" id="statWorkDays">0</div>
    <div class="lbl">有记录天数</div>
  </div>
  <div class="stat-pill">
    <div class="val" id="statRecords">0</div>
    <div class="lbl">总记录数</div>
  </div>
</div>

<!-- ── Sub-ledger list ── -->
<div class="ledgers-section">
  <h2>子账本</h2>
  <div class="ledger-cards" id="ledgerCards">
    <div class="empty-state">
      <div class="icon">📒</div>
      <h3>还没有子账本</h3>
      <p>点击下方按钮创建第一个</p>
    </div>
  </div>
  <div style="margin-top:12px">
    <button class="add-card" onclick="openCreateModal()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
      新建子账本
    </button>
  </div>
</div>

<!-- ── Create modal ── -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>新建子账本</h2>
    <div class="field">
      <label>名称</label>
      <input type="text" id="modalName" placeholder="如：班次收入、出行报销">
    </div>
    <div class="field">
      <label>图标</label>
      <div class="icon-preview" id="createIconPreview">📒</div>
      <div class="emoji-grid" id="createEmojiGrid"></div>
      <div class="icon-upload-row">
        <button class="btn btn-sm btn-ghost upload-btn" onclick="triggerUpload('create')">📁 上传图片</button>
        <span class="icon-hint">推荐 1:1 正方形</span>
      </div>
      <input type="hidden" id="modalIcon" value="📒">
    </div>
    <div class="field">
      <label>描述（可选）</label>
      <input type="text" id="modalDesc" placeholder="简要说明这个账本记什么">
    </div>
    <div class="field">
      <label>子页面路径</label>
      <input type="text" id="modalPath" placeholder="如：work、travel" pattern="[a-z0-9-]+">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCreateModal()">取消</button>
      <button class="btn btn-primary" onclick="createLedger()">创建</button>
    </div>
  </div>
</div>

<!-- ── Edit modal ── -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>编辑子账本</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>名称</label><input type="text" id="editName" placeholder="如：班次收入、出行报销"></div>
    <div class="field"><label>图标</label>
      <div class="icon-preview" id="editIconPreview">📒</div>
      <div class="emoji-grid" id="editEmojiGrid"></div>
      <div class="icon-upload-row">
        <button class="btn btn-sm btn-ghost upload-btn" onclick="triggerUpload('edit')">📁 上传图片</button>
        <span class="icon-hint">推荐 1:1 正方形</span>
      </div>
      <input type="hidden" id="editIcon" value="📒">
    </div>
    <div class="field"><label>描述（可选）</label><input type="text" id="editDesc" placeholder="简要说明这个账本记什么"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" onclick="updateLedger()">保存</button>
    </div>
  </div>
</div>

<script>
// ── Shared helpers ──
const fmtMD = d => d.split('-').slice(1).join('/');
const nowISO = () => new Date().toISOString().split('T')[0];

// ── Ledger registry ──
const META_KEY = 'ledger-meta';

// Default ledgers — seeded once
const DEFAULT_LEDGERS = [
  {
    id: 'work',
    name: '班次收入',
    icon: '☀️',
    description: '白班 150元/天 · 晚班 25元/小时',
    path: 'work',
    preset: 1,
  },
];

// Memory fallback for Safari private mode / localStorage failures
let _memMeta = null;
function _safeLS(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function _safeLSSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

function loadMeta() {
  try {
    const raw = _safeLS(META_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed)) return parsed; }
  } catch {}
  if (_memMeta) return _memMeta.slice();
  _memMeta = DEFAULT_LEDGERS.map(l => ({...l}));
  _safeLSSet(META_KEY, JSON.stringify(DEFAULT_LEDGERS));
  return DEFAULT_LEDGERS.map(l => ({...l}));
}

function saveMeta(meta) {
  _memMeta = meta.map(l => ({...l}));
  _safeLSSet(META_KEY, JSON.stringify(meta));
}

// ── Compute ──
function getLedgerRange(ledgerId) {
  try {
    const raw = _safeLS('ledger-' + ledgerId + '-settings');
    if (raw) {
      const s = JSON.parse(raw);
      // New format: panelRanges.kpi.start/end (preferred)
      if (s.panelRanges && s.panelRanges.kpi) {
        return { start: s.panelRanges.kpi.start, end: s.panelRanges.kpi.end };
      }
      // Old format: dateStart/dateEnd
      if (s.dateStart && s.dateEnd) return { start: s.dateStart, end: s.dateEnd };
      // Periods-based: use active period
      if (s.periods && s.activePeriod != null && s.periods[s.activePeriod]) {
        return { start: s.periods[s.activePeriod].start, end: s.periods[s.activePeriod].end };
      }
    }
  } catch {}
  const now = new Date();
  return {
    start: new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0],
    end: nowISO(),
  };
}

function getLedgerTotal(ledgerId) {
  try {
    const data = JSON.parse(_safeLS('ledger-' + ledgerId)) || [];
    const range = getLedgerRange(ledgerId);
    return data.filter(r => r.date >= range.start && r.date <= range.end).reduce((s, r) => s + (r.earnings || 0), 0);
  } catch { return 0; }
}

function getLedgerStats(ledgerId) {
  try {
    const data = JSON.parse(_safeLS('ledger-' + ledgerId)) || [];
    const range = getLedgerRange(ledgerId);
    const rangeData = data.filter(r => r.date >= range.start && r.date <= range.end);
    const workDays = new Set(rangeData.map(r => r.date)).size;
    return { total: rangeData.reduce((s, r) => s + (r.earnings || 0), 0), workDays, records: rangeData.length };
  } catch { return { total: 0, workDays: 0, records: 0 }; }
}

// ── Render ──
function renderAll() {
  const meta = loadMeta();
  let grandTotal = 0;
  let allWorkDays = new Set();
  let allRecords = 0;

  const cardsHtml = meta.map(l => {
    const stats = getLedgerStats(l.id);
    grandTotal += stats.total;
    // Count ALL records across all time (not filtered by date range)
    try {
      const data = JSON.parse(_safeLS('ledger-' + l.id)) || [];
      data.forEach(r => allWorkDays.add(r.date));
      allRecords += data.length;
    } catch {}

    const preset = l.preset || 1;
    const iconVal = l.icon || '📒';
    const isImg = iconVal.startsWith('data:image');
    return `
      <a href="${l.path}/" class="ledger-card">
        <div class="ledger-icon preset-${preset}${isImg ? ' img-icon' : ''}"${isImg ? ` style="background-image:url(${iconVal})"` : ''}>${isImg ? '' : iconVal}</div>
        <div class="ledger-info">
          <div class="name">${escapeHtml(l.name)}</div>
          <div class="meta">${escapeHtml(l.description || '')}</div>
        </div>
        <div class="ledger-total">
          <div class="amount">¥${stats.total.toLocaleString()}</div>
          <div class="period">统计区间</div>
        </div>
        <span class="ledger-edit" title="编辑" onclick="event.preventDefault();event.stopPropagation();openEditModal('${l.id}')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v3h3l8-8-3-3zM11 2l3 3"/></svg>
        </span>
        <span class="ledger-arrow">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 3l5 5-5 5"/></svg>
        </span>
      </a>`;
  }).join('');

  document.getElementById('heroTotal').textContent = grandTotal.toLocaleString();
  document.getElementById('heroLabel').textContent =
    meta.length === 0 ? '还没有子账本' : `${meta.length} 个子账本 · 统计区间合计`;

  const cardsEl = document.getElementById('ledgerCards');
  if (meta.length === 0) {
    cardsEl.innerHTML = `<div class="empty-state"><div class="icon">📒</div><h3>还没有子账本</h3><p>点击下方按钮创建第一个</p></div>`;
  } else {
    cardsEl.innerHTML = cardsHtml;
  }

  // Quick stats
  const qs = document.getElementById('quickStats');
  if (meta.length === 0) {
    qs.style.display = 'none';
  } else {
    qs.style.display = 'grid';
    document.getElementById('statLedgerCount').textContent = meta.length;
    document.getElementById('statWorkDays').textContent = allWorkDays.size;
    document.getElementById('statRecords').textContent = allRecords;
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Create modal ──
function openCreateModal() {
  document.getElementById('overlay').classList.add('active');
  document.getElementById('modalName').value = '';
  document.getElementById('modalIcon').value = '📒';
  document.getElementById('modalDesc').value = '';
  document.getElementById('modalPath').value = '';
  updateIconPreview('createIconPreview', '📒');
  buildEmojiPalette('create');
  document.getElementById('modalName').focus();
}

function closeCreateModal() {
  document.getElementById('overlay').classList.remove('active');
}

function createLedger() {
  const name = document.getElementById('modalName').value.trim();
  const icon = document.getElementById('modalIcon').value.trim() || '📒';
  const description = document.getElementById('modalDesc').value.trim();
  const path = document.getElementById('modalPath').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');

  if (!name) return alert('请输入名称');
  if (!path) return alert('请输入子页面路径');

  const meta = loadMeta();
  if (meta.find(l => l.id === path || l.path === path)) {
    return alert('该路径已存在，请换一个');
  }

  const newLedger = {
    id: path,
    name,
    icon,
    description,
    path,
    preset: (meta.length % 4) + 1,
  };

  meta.push(newLedger);
  saveMeta(meta);
  closeCreateModal();
  renderAll();
}

// ── Edit ledger ──
function openEditModal(id) {
  const meta = loadMeta();
  const l = meta.find(l => l.id === id);
  if (!l) return;
  document.getElementById('editId').value = l.id;
  document.getElementById('editName').value = l.name;
  document.getElementById('editIcon').value = l.icon || '📒';
  document.getElementById('editDesc').value = l.description || '';
  updateIconPreview('editIconPreview', l.icon || '📒');
  buildEmojiPalette('edit');
  document.getElementById('editOverlay').classList.add('active');
  document.getElementById('editName').focus();
}

function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('active');
}

function updateLedger() {
  const id = document.getElementById('editId').value;
  const name = document.getElementById('editName').value.trim();
  const icon = document.getElementById('editIcon').value.trim() || '📒';
  const description = document.getElementById('editDesc').value.trim();

  if (!name) return alert('请输入名称');

  const meta = loadMeta();
  const idx = meta.findIndex(l => l.id === id);
  if (idx === -1) return;

  meta[idx].name = name;
  meta[idx].icon = icon;
  meta[idx].description = description;
  saveMeta(meta);
  closeEditModal();
  renderAll();
}

// ── Icon picker ──
const EMOJI_LIST = ['☀️','💼','🏠','🚗','✈️','🍜','💰','📚','🎮','🎵','💊','🏥','🛒','👕','🎓','🏋️','📱','💻','🎨','🎬','🐱','🐶','🌱','🎁','💡','⚡','🔧','📋','❤️','🏦','🍕','☕','🎂','🏖️','🎯','📊','💳','🏃','🎉','🛏️'];

function buildEmojiPalette(prefix) {
  const grid = document.getElementById(prefix + 'EmojiGrid');
  if (!grid) return;
  const currentVal = document.getElementById(prefix === 'create' ? 'modalIcon' : 'editIcon').value;
  grid.innerHTML = EMOJI_LIST.map(e =>
    `<button class="emoji-btn${e === currentVal ? ' selected' : ''}" onclick="selectEmoji('${prefix}','${e}')" title="${e}">${e}</button>`
  ).join('');
}

function selectEmoji(prefix, emoji) {
  const inputId = prefix === 'create' ? 'modalIcon' : 'editIcon';
  const previewId = prefix + 'IconPreview';
  document.getElementById(inputId).value = emoji;
  updateIconPreview(previewId, emoji);
  buildEmojiPalette(prefix);
}

function updateIconPreview(previewId, val) {
  const el = document.getElementById(previewId);
  if (!el) return;
  if (val && val.startsWith('data:image')) {
    el.style.backgroundImage = 'url(' + val + ')';
    el.textContent = '';
  } else {
    el.style.backgroundImage = '';
    el.textContent = val || '📒';
  }
}

function triggerUpload(prefix) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => {
    if (input.files[0]) handleImageUpload(prefix, input.files[0]);
  };
  input.click();
}

function handleImageUpload(prefix, file) {
  if (file.size > 2 * 1024 * 1024) return alert('图片不能超过 2MB');
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
      ctx.fillStyle = '#1a1a19'; ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      const dataUri = canvas.toDataURL('image/jpeg', 0.85);
      const inputId = prefix === 'create' ? 'modalIcon' : 'editIcon';
      const previewId = prefix + 'IconPreview';
      document.getElementById(inputId).value = dataUri;
      updateIconPreview(previewId, dataUri);
      buildEmojiPalette(prefix);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCreateModal(); closeEditModal(); }
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeCreateModal();
});
document.getElementById('editOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeEditModal();
});

// ── Init ──
try { renderAll(); } catch(e) { console.error(e); }
</script>
