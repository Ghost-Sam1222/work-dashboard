<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班次收入看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #222221;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.08);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --radius:         16px;
    --radius-sm:      10px;
    --font:           system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page-plane); color: var(--text-primary); min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  /* ── Header ── */
  .back-link { color: var(--text-muted); display: flex; align-items: center; padding: 6px; margin-right: 8px; border-radius: 8px; transition: color .15s, background .15s; flex-shrink: 0; }
  .back-link:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
  .header { padding: 24px 24px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header-top { display: flex; align-items: flex-end; }
  .header-left h1 { font-size: 16px; font-weight: 620; letter-spacing: -0.01em; color: var(--text-muted); }
  .hero-figure { font-size: 50px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .hero-figure .currency { font-size: 24px; font-weight: 500; color: var(--text-secondary); margin-right: 2px; }
  .hero-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 590; font-family: var(--font); cursor: pointer; border: none; transition: opacity .15s, transform .1s; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--series-1); color: #fff; }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: rgba(255,255,255,0.04); }
  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .btn-xs { padding: 3px 8px; font-size: 10px; border-radius: 6px; }

  /* ── Period bar ── */
  .period-bar { display: flex; align-items: center; gap: 8px; padding: 0 24px 16px; flex-wrap: wrap; }
  .period-bar .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  .period-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .period-pill { padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 590; font-family: var(--font); cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); transition: all .12s; white-space: nowrap; }
  .period-pill:hover { border-color: rgba(255,255,255,0.18); color: var(--text-primary); }
  .period-pill.active { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .period-pill .del { margin-left: 4px; opacity: 0; transition: opacity .12s; font-size: 11px; }
  .period-pill:hover .del { opacity: .5; }
  .period-pill .del:hover { opacity: 1; color: var(--critical); }
  .add-period-btn { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 590; font-family: var(--font); cursor: pointer; border: 1px dashed var(--border); background: transparent; color: var(--text-muted); transition: all .12s; white-space: nowrap; }
  .add-period-btn:hover { border-color: rgba(255,255,255,0.16); color: var(--text-secondary); }

  /* ── KPI Row ── */
  .kpi-section { padding: 0 24px 16px; }
  .kpi-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .kpi-header h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .range-pill { display: flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-family: var(--font); cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-muted); transition: all .12s; }
  .range-pill:hover { border-color: rgba(255,255,255,0.18); color: var(--text-secondary); }
  .range-pill input[type="date"] { position: absolute; opacity: 0; pointer-events: none; width: 0; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .kpi-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .kpi-card .value { font-size: 26px; font-weight: 680; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .kpi-card .sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

  /* ── Charts Grid ── */
  .charts-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; padding: 0 24px 16px; }
  .chart-panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .chart-panel.full { grid-column: 1 / -1; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .chart-header h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .chart-header-right { display: flex; align-items: center; gap: 6px; }
  .mode-toggle { display: flex; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .mode-toggle button { padding: 3px 12px; border: none; background: transparent; color: var(--text-muted); font-size: 11px; font-family: var(--font); font-weight: 590; cursor: pointer; transition: all .12s; }
  .mode-toggle button.active { background: var(--series-1); color: #fff; }
  .chart-wrap { position: relative; width: 100%; }
  .chart-wrap.doughnut { max-width: 240px; margin: 0 auto; }
  .chart-wrap canvas { width: 100% !important; }

  /* ── History ── */
  .history-panel { margin: 0 24px 16px; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .history-panel h3 { padding: 16px 20px 10px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .history-item { display: flex; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border); gap: 10px; transition: background .1s; }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: rgba(255,255,255,0.02); }
  .shift-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 620; }
  .shift-badge.day { background: rgba(57,135,229,0.18); color: var(--series-1); }
  .shift-badge.night { background: rgba(217,89,38,0.18); color: var(--series-2); }
  .history-date { font-weight: 590; font-size: 13px; min-width: 75px; }
  .history-detail { color: var(--text-secondary); font-size: 12px; flex: 1; }
  .history-earnings { font-weight: 680; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; }
  .history-del { cursor: pointer; opacity: 0; transition: opacity .15s; padding: 2px; }
  .history-item:hover .history-del { opacity: .5; }
  .history-del:hover { opacity: 1 !important; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
  .empty-state p { font-size: 13px; }

  /* ── Pagination ── */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-top: 1px solid var(--border); }
  .pagination .page-btn { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 590; font-family: var(--font); cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); transition: all .12s; }
  .pagination .page-btn:hover:not(:disabled) { background: rgba(255,255,255,0.05); color: var(--text-primary); }
  .pagination .page-btn:disabled { opacity: 0.3; cursor: default; }
  .pagination .page-info { font-size: 11px; color: var(--text-muted); min-width: 60px; text-align: center; }

  /* ── Modal ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 380px; box-shadow: 0 24px 48px rgba(0,0,0,0.4); }
  .modal h2 { font-size: 17px; font-weight: 640; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 590; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select { width: 100%; padding: 9px 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; font-family: var(--font); outline: none; transition: border-color .15s; }
  .field input:focus, .field select:focus { border-color: var(--series-1); }
  .type-toggle { display: flex; gap: 0; background: var(--surface-1); border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; }
  .type-toggle button { flex: 1; padding: 9px; border: none; background: transparent; color: var(--text-secondary); font-size: 13px; font-family: var(--font); font-weight: 590; cursor: pointer; transition: all .15s; }
  .type-toggle button.active-day { background: var(--series-1); color: #fff; }
  .type-toggle button.active-night { background: var(--series-2); color: #fff; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .earning-preview { text-align: center; padding: 8px; background: var(--surface-1); border-radius: var(--radius-sm); font-size: 18px; font-weight: 680; color: var(--text-primary); }

  @media (max-width: 768px) {
    .header { padding: 18px 16px 12px; }
    .hero-figure { font-size: 38px; }
    .hero-figure .currency { font-size: 20px; }
    .period-bar { padding: 0 16px 12px; }
    .kpi-section { padding: 0 16px 12px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .charts-grid { grid-template-columns: 1fr; padding: 0 16px 8px; }
    .history-panel { margin: 0 16px 16px; }
    .chart-wrap.doughnut { max-width: 200px; }
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="header-top">
    <a href="../" class="back-link" title="返回总账本">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L5 8l6 5"/></svg>
    </a>
    <div class="header-left">
      <h1>班次收入</h1>
      <div class="hero-figure"><span class="currency">¥</span><span id="heroTotal">0</span></div>
      <div class="hero-label">手动选择统计区间</div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="openShiftModal()">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
    添加班次
  </button>
</div>

<!-- ── Period bar ── -->
<div class="period-bar">
  <span class="label">工期</span>
  <div class="period-pills" id="periodPills"></div>
  <button class="add-period-btn" onclick="openPeriodModal()">+ 新建</button>
</div>

<!-- ════ 板块1: KPI ════ -->
<div class="kpi-section">
  <div class="kpi-header">
    <h3>📊 统计概览</h3>
    <button class="range-pill" onclick="pickRange('kpi', this)" id="rangeBtn_kpi">
      <span id="rangeLabel_kpi">--</span>
      <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <input type="date" id="dr_kpi_start" style="display:none" onchange="onPanelRangeChange('kpi')">
    <input type="date" id="dr_kpi_end" style="display:none" onchange="onPanelRangeChange('kpi')">
  </div>
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="label">白班天数</div>
      <div class="value" id="kpiDayCount">0</div>
      <div class="sub">150 元/天</div>
    </div>
    <div class="kpi-card">
      <div class="label">晚班次数</div>
      <div class="value" id="kpiNightCount">0</div>
      <div class="sub">25 元/小时</div>
    </div>
    <div class="kpi-card">
      <div class="label">晚班总工时</div>
      <div class="value" id="kpiHours">0<span style="font-size:14px;font-weight:500;color:var(--text-secondary)"> h</span></div>
      <div class="sub">晚班累计小时</div>
    </div>
    <div class="kpi-card">
      <div class="label">日均收入</div>
      <div class="value" id="kpiAvg">¥0</div>
      <div class="sub" id="kpiAvgLabel">--</div>
    </div>
  </div>
</div>

<!-- ════ 板块2+3+4: Charts ════ -->
<div class="charts-grid">
  <!-- 板块2: 饼图 -->
  <div class="chart-panel">
    <div class="chart-header">
      <h3>🥧 收入占比</h3>
      <button class="range-pill" onclick="pickRange('pie', this)" id="rangeBtn_pie">
        <span id="rangeLabel_pie">--</span>
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <input type="date" id="dr_pie_start" style="display:none" onchange="onPanelRangeChange('pie')">
      <input type="date" id="dr_pie_end" style="display:none" onchange="onPanelRangeChange('pie')">
    </div>
    <div class="chart-wrap doughnut"><canvas id="pieChart"></canvas></div>
  </div>

  <!-- 板块3: 柱状图 -->
  <div class="chart-panel">
    <div class="chart-header">
      <h3>📊 每日收入</h3>
      <button class="range-pill" onclick="pickRange('bar', this)" id="rangeBtn_bar">
        <span id="rangeLabel_bar">--</span>
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <input type="date" id="dr_bar_start" style="display:none" onchange="onPanelRangeChange('bar')">
      <input type="date" id="dr_bar_end" style="display:none" onchange="onPanelRangeChange('bar')">
    </div>
    <div class="chart-wrap"><canvas id="barChart"></canvas></div>
  </div>

  <!-- 板块4: 折线图 -->
  <div class="chart-panel full">
    <div class="chart-header">
      <h3>📈 收入趋势</h3>
      <div class="chart-header-right">
        <div class="mode-toggle" id="lineModeToggle">
          <button id="modeCumulative" class="active" onclick="setLineMode('cumulative')">累计</button>
          <button id="modeDaily" onclick="setLineMode('daily')">每日</button>
        </div>
        <button class="range-pill" onclick="pickRange('line', this)" id="rangeBtn_line">
          <span id="rangeLabel_line">--</span>
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <input type="date" id="dr_line_start" style="display:none" onchange="onPanelRangeChange('line')">
        <input type="date" id="dr_line_end" style="display:none" onchange="onPanelRangeChange('line')">
      </div>
    </div>
    <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
  </div>
</div>

<!-- ── History ── -->
<div class="history-panel">
  <h3>📋 班次记录 <span style="font-weight:400;font-size:11px;color:var(--text-muted)" id="historyCount"></span></h3>
  <div class="history-list" id="historyList">
    <div class="empty-state"><div class="icon">📋</div><p>暂无记录</p></div>
  </div>
  <div class="pagination" id="pagination" style="display:none">
    <button class="page-btn" id="pagePrev" onclick="changePage(-1)">← 上一页</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="page-btn" id="pageNext" onclick="changePage(1)">下一页 →</button>
  </div>
</div>

<!-- ── Shift Modal ── -->
<div class="overlay" id="shiftOverlay">
  <div class="modal">
    <h2>添加班次</h2>
    <div class="field"><label>日期</label><input type="date" id="modalDate"></div>
    <div class="field"><label>班次类型</label>
      <div class="type-toggle"><button id="btnDay" class="active-day" onclick="setType('day')">☀️ 白班</button><button id="btnNight" onclick="setType('night')">🌙 晚班</button></div>
    </div>
    <div class="field" id="hoursField" style="display:none"><label>晚班时长（小时）</label><input type="number" id="modalHours" placeholder="如 4、3.5" min="0.5" max="24" step="0.5"></div>
    <div class="field" id="previewField" style="display:none"><label>预计收入</label><div class="earning-preview" id="earningPreview">¥0</div></div>
    <div class="field"><label>备注（可选）</label><input type="text" id="modalNote" placeholder="如：替班、加班"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeShiftModal()">取消</button>
      <button class="btn btn-primary" onclick="saveShift()">保存</button>
    </div>
  </div>
</div>

<!-- ── Period Modal ── -->
<div class="overlay" id="periodOverlay">
  <div class="modal">
    <h2>新建工期</h2>
    <div class="field"><label>名称（可选）</label><input type="text" id="periodName" placeholder="如：暑假工、正式上班"></div>
    <div class="field"><label>起始日期</label><input type="date" id="periodStart"></div>
    <div class="field"><label>结束日期</label><input type="date" id="periodEnd"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closePeriodModal()">取消</button>
      <button class="btn btn-primary" onclick="savePeriod()">保存</button>
    </div>
  </div>
</div>

<script>
// ── Data layer ──
const STORAGE_KEY = 'ledger-work';
const SETTINGS_KEY = 'ledger-work-settings';
const PER_PAGE = 12;
const PANELS = ['kpi', 'pie', 'bar', 'line'];

if (!localStorage.getItem(STORAGE_KEY) && localStorage.getItem('work-schedule-data')) {
  localStorage.setItem(STORAGE_KEY, localStorage.getItem('work-schedule-data'));
}

let currentType = 'day';
let currentPage = 1;
let pickingPanel = null;

function loadData() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function addRecord(r) { const d = loadData(); d.push(r); saveData(d); }
function deleteRecord(id) { saveData(loadData().filter(r => r.id !== id)); }

// ── Settings ──
const DEFAULT_SETTINGS = {
  periods: [{ name: '7/27-8/19', start: '2026-07-27', end: '2026-08-19' }],
  activePeriod: 0,
  panelRanges: {
    kpi: { start: '2026-07-27', end: '2026-08-19' },
    pie: { start: '2026-07-27', end: '2026-08-19' },
    bar: { start: '2026-07-27', end: '2026-08-19' },
    line: { start: '2026-07-27', end: '2026-08-19' },
  },
  lineMode: 'cumulative',
};

function loadSettings() {
  try { const raw = localStorage.getItem(SETTINGS_KEY); if (raw) return JSON.parse(raw); } catch {}
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(DEFAULT_SETTINGS));
  return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
}
function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

function getPanelRange(settings, panel) {
  const pr = settings.panelRanges[panel];
  if (pr && pr.start && pr.end) return { start: pr.start, end: pr.end };
  // Fallback to active period
  const ap = settings.periods[settings.activePeriod];
  if (ap) return { start: ap.start, end: ap.end };
  return { start: '2026-07-27', end: '2026-08-19' };
}

function filterByRange(data, start, end) {
  return data.filter(r => r.date >= start && r.date <= end);
}

// ── Render all ──
let pieChart, barChart, lineChart;

function renderAll() {
  const settings = loadSettings();
  const data = loadData();

  // Period pills
  renderPeriods(settings);

  // Each panel
  renderKPI(data, settings);
  renderPieChart(data, settings);
  renderBarChart(data, settings);
  renderLineChart(data, settings);
  renderHistory(data);
}

// ── Periods ──
function renderPeriods(settings) {
  const el = document.getElementById('periodPills');
  el.innerHTML = settings.periods.map((p, i) => {
    const active = i === settings.activePeriod ? ' active' : '';
    const name = p.name || (p.start + ' → ' + p.end);
    return `<button class="period-pill${active}" onclick="selectPeriod(${i})">
      ${name}<span class="del" onclick="event.stopPropagation();deletePeriod(${i})">×</span>
    </button>`;
  }).join('');
}

function selectPeriod(idx) {
  const s = loadSettings();
  s.activePeriod = idx;
  const p = s.periods[idx];
  if (p) {
    // Update all panel ranges to match
    PANELS.forEach(k => { s.panelRanges[k] = { start: p.start, end: p.end }; });
  }
  saveSettings(s);
  renderAll();
}

function deletePeriod(idx) {
  const s = loadSettings();
  if (s.periods.length <= 1) return alert('至少保留一个工期');
  s.periods.splice(idx, 1);
  if (s.activePeriod >= s.periods.length) s.activePeriod = s.periods.length - 1;
  saveSettings(s);
  renderAll();
}

function openPeriodModal() {
  document.getElementById('periodOverlay').classList.add('active');
  document.getElementById('periodName').value = '';
  document.getElementById('periodStart').value = '2026-07-27';
  document.getElementById('periodEnd').value = '2026-08-19';
}
function closePeriodModal() { document.getElementById('periodOverlay').classList.remove('active'); }

function savePeriod() {
  const name = document.getElementById('periodName').value.trim();
  const start = document.getElementById('periodStart').value;
  const end = document.getElementById('periodEnd').value;
  if (!start || !end) return alert('请选择起止日期');
  if (start > end) return alert('起始日期不能晚于结束日期');

  const s = loadSettings();
  const autoName = name || (start + ' → ' + end);
  s.periods.push({ name: autoName, start, end });
  s.activePeriod = s.periods.length - 1;
  PANELS.forEach(k => { s.panelRanges[k] = { start, end }; });
  saveSettings(s);
  closePeriodModal();
  renderAll();
}

// ── Panel range picker ──
function pickRange(panel, btn) {
  const s = loadSettings();
  const range = getPanelRange(s, panel);
  const startInput = document.getElementById('dr_' + panel + '_start');
  const endInput = document.getElementById('dr_' + panel + '_end');
  startInput.value = range.start;
  endInput.value = range.end;
  startInput.showPicker ? startInput.showPicker() : startInput.click();
}

function onPanelRangeChange(panel) {
  const start = document.getElementById('dr_' + panel + '_start').value;
  const end = document.getElementById('dr_' + panel + '_end').value;
  if (!start || !end) return;
  const s = loadSettings();
  s.panelRanges[panel] = { start, end };
  saveSettings(s);
  renderAll();
}

function updateRangeLabel(panel, start, end) {
  const el = document.getElementById('rangeLabel_' + panel);
  if (el) el.textContent = start.split('-').slice(1).join('/') + ' → ' + end.split('-').slice(1).join('/');
}

// ── KPI ──
function renderKPI(data, settings) {
  const range = getPanelRange(settings, 'kpi');
  updateRangeLabel('kpi', range.start, range.end);

  const rd = filterByRange(data, range.start, range.end);
  const dayShifts = rd.filter(r => r.type === 'day');
  const nightShifts = rd.filter(r => r.type === 'night');
  const total = rd.reduce((s, r) => s + r.earnings, 0);
  const dayCount = dayShifts.length;
  const nightCount = nightShifts.length;
  const nightHours = nightShifts.reduce((s, r) => s + (r.hours || 0), 0);
  const workDays = new Set(rd.map(r => r.date)).size;
  const avgDaily = workDays > 0 ? Math.round(total / workDays) : 0;

  document.getElementById('heroTotal').textContent = total.toLocaleString();
  document.getElementById('kpiDayCount').textContent = dayCount;
  document.getElementById('kpiNightCount').textContent = nightCount;
  document.getElementById('kpiHours').innerHTML = nightHours + '<span style="font-size:14px;font-weight:500;color:var(--text-secondary)"> h</span>';
  document.getElementById('kpiAvg').textContent = '¥' + avgDaily.toLocaleString();
  document.getElementById('kpiAvgLabel').textContent = workDays + ' 个工作日';
}

// ── Pie ──
function renderPieChart(data, settings) {
  if (pieChart) { pieChart.destroy(); pieChart = null; }
  const range = getPanelRange(settings, 'pie');
  updateRangeLabel('pie', range.start, range.end);

  const rd = filterByRange(data, range.start, range.end);
  const dayEarnings = rd.filter(r => r.type === 'day').length * 150;
  const nightEarnings = rd.filter(r => r.type === 'night').reduce((s, r) => s + r.earnings, 0);
  const total = dayEarnings + nightEarnings;

  const ctx = document.getElementById('pieChart').getContext('2d');
  if (total === 0) {
    pieChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: ['暂无数据'], datasets: [{ data: [1], backgroundColor: ['#2c2c2a'], borderColor: '#1a1a19', borderWidth: 2 }] },
      options: { responsive: true, maintainAspectRatio: true, cutout: '65%', plugins: { legend: { display: false }, tooltip: { enabled: false } } },
    });
    return;
  }

  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['白班', '晚班'],
      datasets: [{ data: [dayEarnings, nightEarnings], backgroundColor: ['#3987e5', '#d95926'], borderColor: '#1a1a19', borderWidth: 2 }],
    },
    options: {
      responsive: true, maintainAspectRatio: true, cutout: '55%',
      plugins: {
        legend: { position: 'bottom', labels: { color: '#c3c2b7', padding: 16, font: { size: 12 }, usePointStyle: true, pointStyleWidth: 8 } },
        tooltip: {
          backgroundColor: '#222221', titleColor: '#fff', bodyColor: '#c3c2b7', borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1, cornerRadius: 6, padding: 8,
          callbacks: { label: ctx => ` ${ctx.label}: ¥${ctx.raw.toLocaleString()} (${((ctx.raw/total)*100).toFixed(1)}%)` },
        },
      },
    },
  });
}

// ── Bar ──
function renderBarChart(data, settings) {
  if (barChart) { barChart.destroy(); barChart = null; }
  const range = getPanelRange(settings, 'bar');
  updateRangeLabel('bar', range.start, range.end);

  // Build date list from range
  const days = [];
  const d = new Date(range.start + 'T00:00:00');
  const end = new Date(range.end + 'T00:00:00');
  while (d <= end) { days.push(d.toISOString().split('T')[0]); d.setDate(d.getDate() + 1); }

  const earningsByDay = {};
  data.forEach(r => { if (days.includes(r.date)) earningsByDay[r.date] = (earningsByDay[r.date] || 0) + r.earnings; });
  const values = days.map(d => earningsByDay[d] || 0);
  const labels = days.map(d => { const p = d.split('-'); return p[1] + '/' + p[2]; });

  // Dynamic bar thickness: more days → thinner bars
  const dayCount = days.length;
  const maxThickness = Math.max(6, Math.min(24, Math.floor(400 / dayCount)));

  const ctx = document.getElementById('barChart').getContext('2d');
  barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: values.map(v => v > 0 ? '#3987e5' : '#2c2c2a'),
        borderRadius: maxThickness > 8 ? 3 : 2,
        borderSkipped: false,
        maxBarThickness: maxThickness,
        barPercentage: dayCount <= 7 ? 0.6 : dayCount <= 14 ? 0.8 : 0.95,
        categoryPercentage: dayCount <= 7 ? 0.6 : dayCount <= 14 ? 0.8 : 0.95,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#222221', titleColor: '#fff', bodyColor: '#c3c2b7', borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1, cornerRadius: 6, padding: 8,
          callbacks: { title: items => days[items[0].dataIndex], label: ctx => ctx.raw > 0 ? ` ¥${ctx.raw.toLocaleString()}` : ' 休息' },
        },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#898781', font: { size: 10 }, maxTicksLimit: 25, autoSkip: true }, border: { color: '#383835' } },
        y: { grid: { color: '#2c2c2a' }, ticks: { color: '#898781', font: { size: 11 }, callback: v => '¥' + v }, border: { color: '#383835' }, beginAtZero: true },
      },
    },
  });
}

// ── Line ──
function setLineMode(mode) {
  const s = loadSettings();
  s.lineMode = mode;
  saveSettings(s);
  renderAll();
}

function renderLineChart(data, settings) {
  if (lineChart) { lineChart.destroy(); lineChart = null; }
  const range = getPanelRange(settings, 'line');
  const mode = settings.lineMode || 'cumulative';
  updateRangeLabel('line', range.start, range.end);

  // Toggle buttons
  document.getElementById('modeCumulative').className = mode === 'cumulative' ? 'active' : '';
  document.getElementById('modeDaily').className = mode === 'daily' ? 'active' : '';

  const rd = filterByRange(data, range.start, range.end).sort((a, b) => a.date.localeCompare(b.date));
  const ctx = document.getElementById('lineChart').getContext('2d');

  if (rd.length === 0) {
    lineChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [range.start, range.end], datasets: [{ data: [0, 0], borderColor: '#2c2c2a', borderWidth: 2, pointRadius: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } } },
    });
    return;
  }

  const byDate = {};
  rd.forEach(r => { byDate[r.date] = (byDate[r.date] || 0) + r.earnings; });
  const sortedDates = Object.keys(byDate).sort();

  let labels, values, color, bgColor;
  if (mode === 'cumulative') {
    labels = []; values = []; let running = 0;
    sortedDates.forEach(date => {
      running += byDate[date];
      labels.push(date.split('-').slice(1).join('/'));
      values.push(running);
    });
    color = '#d95926'; bgColor = 'rgba(217,89,38,0.08)';
  } else {
    labels = sortedDates.map(d => d.split('-').slice(1).join('/'));
    values = sortedDates.map(d => byDate[d]);
    color = '#3987e5'; bgColor = 'rgba(57,135,229,0.08)';
  }

  lineChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values, borderColor: color, backgroundColor: bgColor,
        borderWidth: 2, pointRadius: values.length > 30 ? 0 : 3,
        pointBackgroundColor: color, pointBorderColor: '#1a1a19', pointBorderWidth: 2, pointHoverRadius: 6,
        fill: true, tension: 0.3,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#222221', titleColor: '#fff', bodyColor: color, borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1, cornerRadius: 6, padding: 8, displayColors: false,
          callbacks: { label: ctx => (mode === 'cumulative' ? '累计 ' : '') + '¥' + ctx.raw.toLocaleString() },
        },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#898781', font: { size: 10 }, maxTicksLimit: 15 }, border: { color: '#383835' } },
        y: { grid: { color: '#2c2c2a' }, ticks: { color: '#898781', font: { size: 11 }, callback: v => '¥' + v.toLocaleString() }, border: { color: '#383835' }, beginAtZero: true },
      },
    },
  });
}

// ── History ──
function renderHistory(data) {
  const sorted = [...data].sort((a, b) => b.date.localeCompare(a.date));
  const totalPages = Math.ceil(sorted.length / PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  document.getElementById('historyCount').textContent = `（共 ${sorted.length} 条）`;
  const el = document.getElementById('historyList');

  if (sorted.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>暂无记录</p></div>`;
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const start = (currentPage - 1) * PER_PAGE;
  const pageItems = sorted.slice(start, start + PER_PAGE);
  const today = new Date().toISOString().split('T')[0];

  el.innerHTML = pageItems.map(r => {
    const bc = r.type === 'day' ? 'day' : 'night';
    const bt = r.type === 'day' ? '☀️ 白班' : '🌙 晚班';
    let detail = r.type === 'day' ? '8:20–18:00 · ¥150' : `${r.hours}h · ¥${r.earnings}`;
    if (r.note) detail += ` · ${r.note}`;
    return `<div class="history-item">
      <span class="history-date">${r.date.split('-').slice(1).join('/')}${r.date === today ? ' <span style="color:var(--series-2);font-size:10px">今天</span>' : ''}</span>
      <span class="shift-badge ${bc}">${bt}</span>
      <span class="history-detail">${detail}</span>
      <span class="history-earnings">¥${r.earnings}</span>
      <span class="history-del" title="删除" onclick="event.stopPropagation();removeShift('${r.id}')">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="2" y1="4" x2="14" y2="4"/><path d="M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1M6 7v5M10 7v5"/></svg>
      </span>
    </div>`;
  }).join('');

  const pagEl = document.getElementById('pagination');
  if (totalPages > 1) {
    pagEl.style.display = 'flex';
    document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
    document.getElementById('pagePrev').disabled = currentPage <= 1;
    document.getElementById('pageNext').disabled = currentPage >= totalPages;
  } else { pagEl.style.display = 'none'; }
}

function changePage(d) { currentPage += d; renderAll(); }

// ── Shift modal ──
function openShiftModal() {
  document.getElementById('shiftOverlay').classList.add('active');
  document.getElementById('modalDate').value = new Date().toISOString().split('T')[0];
  setType('day');
  document.getElementById('modalHours').value = '';
  document.getElementById('modalNote').value = '';
}
function closeShiftModal() { document.getElementById('shiftOverlay').classList.remove('active'); }

function setType(t) {
  currentType = t;
  const hf = document.getElementById('hoursField'), pf = document.getElementById('previewField');
  if (t === 'day') {
    document.getElementById('btnDay').className = 'active-day';
    document.getElementById('btnNight').className = '';
    hf.style.display = 'none'; pf.style.display = 'none';
    document.getElementById('modalHours').value = '';
  } else {
    document.getElementById('btnDay').className = '';
    document.getElementById('btnNight').className = 'active-night';
    hf.style.display = 'block'; pf.style.display = 'block';
    updatePreview();
  }
}
function updatePreview() { document.getElementById('earningPreview').textContent = '¥' + ((parseFloat(document.getElementById('modalHours').value) || 0) * 25); }
document.getElementById('modalHours').addEventListener('input', updatePreview);

function saveShift() {
  const date = document.getElementById('modalDate').value;
  if (!date) return alert('请选择日期');
  let hours = 0, earnings = 0;
  if (currentType === 'day') { earnings = 150; }
  else {
    hours = parseFloat(document.getElementById('modalHours').value);
    if (!hours || hours <= 0) return alert('请输入晚班时长');
    earnings = Math.round(hours * 25);
  }
  addRecord({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, type: currentType, hours: currentType === 'night' ? hours : 0, earnings, note: document.getElementById('modalNote').value.trim() || '' });
  closeShiftModal();
  currentPage = 1;
  renderAll();
}

function removeShift(id) { if (!confirm('确定删除？')) return; deleteRecord(id); renderAll(); }

// ── Keyboard ──
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeShiftModal(); closePeriodModal(); } });
document.getElementById('shiftOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeShiftModal(); });
document.getElementById('periodOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closePeriodModal(); });

// ── Init ──
renderAll();
</script>
</body>
</html>
